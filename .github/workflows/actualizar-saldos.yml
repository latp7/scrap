name: Actualizar saldos externos

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actualizar-saldos
  cancel-in-progress: false

jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Recuperar última lectura válida
        run: curl --fail --retry 3 --output external-data.json https://scrap-trigger.scrap-trigger.workers.dev/data
      - run: npm ci
      - name: Consultar fuentes externas
        run: node scripts/snapshot-biopetrol.mjs
      - name: Guardar última lectura en Cloudflare KV
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          curl --fail-with-body --retry 3 --request PUT \
            --header "Authorization: Bearer $UPLOAD_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @external-data.json \
            https://scrap-trigger.scrap-trigger.workers.dev/data
