name: Actualizar saldos externos
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/snapshot-biopetrol.mjs"
      - ".github/workflows/actualizar-saldos.yml"
permissions:
  contents: write
concurrency:
  group: actualizar-saldos
  cancel-in-progress: false
jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consultar fuentes externas
        run: node scripts/snapshot-biopetrol.mjs
      - name: Publicar solamente las lecturas externas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add external-data.json
          git diff --cached --quiet || git commit -m "Actualizar saldos externos"
          git push

